<!DOCTYPE html>
<html lang="en" class="auth-pending">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <title>Sign in | Termline</title>
        <meta name="theme-color" content="#1f1f1f">
        <link rel="manifest" href="manifest.webmanifest">
        <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
        <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-title" content="Termline">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
        <script src="theme.js"></script>
    </head>
    <body>
        <button id="theme-toggle" class="theme-toggle auth-theme" type="button" title="Theme: Auto" aria-label="Theme: Auto">◐</button>

        <main class="auth-main">
            <div class="auth-card">
                <img src="icons/icon-192.png" alt="" class="auth-logo">
                <h1>Termline</h1>
                <p class="auth-tagline">Your classes, tasks, and week on one timeline.</p>
                <p id="auth-notice" class="auth-notice" hidden></p>

                <!-- Sign in / Create account -->
                <div id="auth-forms">
                    <button type="button" id="google-button" class="btn btn-secondary google-button">
                        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
                            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                            <path fill="#34A853" d="M24 48c6.48 0 11.930-2.13 15.89-5.81l-7.73-6c-2.150 1.45-4.920 2.3-8.160 2.3-6.260 0-11.570-4.220-13.470-9.910l-7.980 6.190C6.51 42.62 14.62 48 24 48z"/>
                        </svg>
                        Continue with Google
                    </button>

                    <div class="auth-divider"><span>or</span></div>

                    <form id="auth-form">
                        <label class="field" id="name-field" hidden>Name
                            <input type="text" name="name" autocomplete="name">
                        </label>
                        <label class="field">Email
                            <input type="email" name="email" autocomplete="email" required>
                        </label>
                        <label class="field">Password
                            <input type="password" name="password" autocomplete="current-password" minlength="6" required>
                        </label>
                        <button type="button" id="forgot-button" class="link-button">Forgot password?</button>
                        <p id="auth-error" class="auth-error" hidden></p>
                        <button type="submit" id="submit-button" class="btn btn-primary">Sign in</button>
                    </form>

                    <p class="auth-switch">
                        <span id="switch-text">New to Termline?</span>
                        <button type="button" id="switch-button" class="link-button">Create an account</button>
                    </p>
                </div>

                <!-- Shown after creating an account, until the email is verified -->
                <div id="verify-screen" hidden>
                    <h2>Verify your email</h2>
                    <p>We sent a link to <strong id="verify-email"></strong>. Click it, then come back and continue. Check your spam folder if you don't see it.</p>
                    <p id="verify-error" class="auth-error" hidden></p>
                    <button type="button" id="verified-button" class="btn btn-primary">I've verified my email</button>
                    <button type="button" id="resend-button" class="btn btn-secondary">Resend email</button>
                    <button type="button" id="different-button" class="link-button">Use a different account</button>
                </div>
            </div>
        </main>

        <script src="storage.js"></script>
        <script type="module" src="signin.js"></script>
    </body>
</html>
