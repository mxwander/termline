<!DOCTYPE html>
<html lang="en" class="auth-pending">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <title>Edit | Termline</title>
        <meta name="theme-color" content="#1f1f1f">
        <link rel="manifest" href="manifest.webmanifest">
        <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
        <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-title" content="Termline">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
        <script src="theme.js"></script>
        <script type="module" src="account.js"></script>
        <script type="module" src="data-sync.js"></script>
    </head>
    <body>
        <aside class="sidebar">
            <h1>Termline</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="calendar.html">Calendar</a>
                <a href="edit.html" class="active">Edit</a>
            </nav>
            <button id="theme-toggle" class="theme-toggle" type="button" title="Theme: Auto" aria-label="Theme: Auto">◐</button>
        </aside>

        <main>
            <div class="edit-grid">

                <!-- Top left: Add a Class -->
                <section id="add-class">
                    <h2>Add a Class</h2>
                    <form id="class-form">
                        <label class="field">Course code <span class="req">*</span>
                            <input type="text" name="code" placeholder="e.g., MA 241" required>
                        </label>

                        <div class="field-row">
                            <label class="field">Course title
                                <input type="text" name="title" placeholder="e.g., Calculus II">
                            </label>
                            <label class="field">Instructor
                                <input type="text" name="instructor" placeholder="e.g., Dr. Smith">
                            </label>
                        </div>

                        <div class="field-row">
                            <label class="field">Location
                                <input type="text" name="location" placeholder="e.g., SAS Hall 1102">
                            </label>
                            <div class="field">Color
                                <div class="color-picker">
                                    <button type="button" class="swatch" data-color="#e06c75" style="--swatch: #e06c75" title="Red" aria-label="Red"></button>
                                    <button type="button" class="swatch" data-color="#f0883e" style="--swatch: #f0883e" title="Orange" aria-label="Orange"></button>
                                    <button type="button" class="swatch" data-color="#e5c07b" style="--swatch: #e5c07b" title="Yellow" aria-label="Yellow"></button>
                                    <button type="button" class="swatch" data-color="#98c379" style="--swatch: #98c379" title="Green" aria-label="Green"></button>
                                    <button type="button" class="swatch" data-color="#61afef" style="--swatch: #61afef" title="Blue" aria-label="Blue"></button>
                                    <button type="button" class="swatch" data-color="#c678dd" style="--swatch: #c678dd" title="Purple" aria-label="Purple"></button>
                                    <button type="button" class="btn-small swatch-custom">Custom</button>
                                    <input type="color" name="color" value="#e06c75" class="custom-color" hidden>
                                </div>
                            </div>
                        </div>

                        <label class="online-toggle">
                            <input type="checkbox" name="online"> Online class
                        </label>

                        <div class="meetings">
                            <fieldset class="meeting">
                                <legend>Meeting time</legend>
                                <div class="field-row">
                                    <label class="field">Type
                                        <select class="meeting-type">
                                            <option>Lecture</option>
                                            <option>Recitation</option>
                                            <option>Lab</option>
                                            <option>Class</option>
                                            <option>Other</option>
                                        </select>
                                    </label>
                                    <label class="field">Start <span class="req">*</span>
                                        <input type="time" class="meeting-start" required>
                                    </label>
                                    <label class="field">End <span class="req">*</span>
                                        <input type="time" class="meeting-end" required>
                                    </label>
                                </div>
                                <div class="days">
                                    <label><input type="checkbox" value="M"> Mon</label>
                                    <label><input type="checkbox" value="T"> Tue</label>
                                    <label><input type="checkbox" value="W"> Wed</label>
                                    <label><input type="checkbox" value="H"> Thu</label>
                                    <label><input type="checkbox" value="F"> Fri</label>
                                    <label><input type="checkbox" value="S"> Sat</label>
                                    <label><input type="checkbox" value="U"> Sun</label>
                                </div>
                            </fieldset>
                        </div>

                        <button type="button" class="btn btn-secondary add-meeting">+ Add meeting time</button>
                        <button type="submit" class="btn btn-primary">Save Class</button>
                    </form>
                </section>

                <!-- Top right: Add a Task -->
                <section id="add-task">
                    <h2>Add a Task</h2>
                    <form id="task-form">
                        <label class="field">Task name <span class="req">*</span>
                            <input type="text" name="name" placeholder="e.g., Homework 7" required>
                        </label>

                        <div class="field-row">
                            <label class="field">Type <span class="req">*</span>
                                <select name="type" required>
                                    <option value="">Choose a type</option>
                                    <option>Assignment / Homework</option>
                                    <option>Exam</option>
                                    <option>Quiz</option>
                                    <option>Project</option>
                                    <option>Studying</option>
                                    <option>Other</option>
                                </select>
                            </label>
                            <label class="field">Class
                                <select name="classId">
                                    <option value="">None</option>
                                </select>
                            </label>
                        </div>

                        <label class="field other-field" hidden>Type name <span class="req">*</span>
                            <input type="text" name="otherType" placeholder="e.g., Reading">
                        </label>

                        <div class="field-row">
                            <label class="field">Due date <span class="req">*</span>
                                <input type="date" name="dueDate" required>
                            </label>
                            <label class="field">Due time <span class="req">*</span>
                                <input type="time" name="dueTime" value="23:59" required>
                            </label>
                        </div>

                        <div class="field-row">
                            <label class="field">Est. hours
                                <input type="number" name="hours" min="0" placeholder="0">
                            </label>
                            <label class="field">Est. minutes
                                <input type="number" name="minutes" min="0" max="59" step="5" placeholder="0">
                            </label>
                            <label class="field">Priority
                                <select name="priority">
                                    <option value="">None</option>
                                    <option>Low</option>
                                    <option>Medium</option>
                                    <option>High</option>
                                </select>
                            </label>
                        </div>

                        <label class="field">Notes
                            <textarea name="notes" placeholder="Details, instructions, links..."></textarea>
                        </label>

                        <button type="submit" class="btn btn-primary">Save Task</button>
                    </form>
                </section>

                <!-- Bottom left: Saved Classes -->
                <section id="saved-classes" class="saved-list">
                    <div class="list-header">
                        <h2>Saved Classes</h2>
                        <div class="list-controls" data-kind="class"></div>
                    </div>
                    <div id="class-list"></div>
                </section>

                <!-- Bottom right: Saved Tasks -->
                <section id="saved-tasks" class="saved-list">
                    <div class="list-header">
                        <h2>Saved Tasks</h2>
                        <div class="list-controls" data-kind="task"></div>
                    </div>
                    <div id="task-list"></div>
                </section>

            </div>

            <div class="danger-zone">
                <button type="button" id="clear-all" class="btn btn-danger">Clear everything</button>
            </div>
        </main>

        <!-- Pop-up for editing a class or task (filled in by edit.js) -->
        <dialog id="edit-dialog" class="modal"></dialog>

        <!-- Pop-up for "Are you sure?" questions -->
        <dialog id="confirm-dialog" class="modal modal-small">
            <p id="confirm-message"></p>
            <div class="dialog-actions">
                <button type="button" id="confirm-no" class="btn btn-secondary">Cancel</button>
                <button type="button" id="confirm-yes" class="btn btn-primary">Delete</button>
            </div>
        </dialog>

        <!-- Pop-up for "Clear everything" (must type CLEAR) -->
        <dialog id="clear-dialog" class="modal modal-small">
            <h2>Clear everything?</h2>
            <p>This permanently deletes all of your classes and tasks. Type <strong class="mono">CLEAR</strong> to confirm.</p>
            <input type="text" id="clear-input" autocomplete="off" placeholder="CLEAR">
            <div class="dialog-actions">
                <button type="button" id="clear-no" class="btn btn-secondary">Cancel</button>
                <button type="button" id="clear-yes" class="btn btn-primary" disabled>Clear everything</button>
            </div>
        </dialog>

        <script src="storage.js"></script>
        <script src="edit.js"></script>
    </body>
</html>
