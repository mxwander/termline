<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Home | Class Planner</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
        <script src="theme.js"></script>
    </head>
    <body>
        <aside class="sidebar">
            <h1>Class Planner</h1>
            <nav>
                <a href="index.html" class="active">Home</a>
                <a href="calendar.html">Calendar</a>
                <a href="edit.html">Edit</a>
            </nav>
            <button id="theme-toggle" class="theme-toggle" type="button" title="Theme: Auto" aria-label="Theme: Auto">◐</button>
        </aside>

        <main>
            <section id="today">
                <h2>Today <span id="today-date" class="today-date"></span></h2>
                <h3>Classes</h3>
                <div id="today-classes"></div>
                <h3>Tasks</h3>
                <div id="today-tasks"></div>
            </section>

            <section id="weekly-timeline">
                <h2>Weekly Timeline</h2>
                <p>The week view will go here.</p>
            </section>

            <section id="todo">
                <h2>To-Do (Next 10 Days)</h2>
                <div id="todo-list"></div>
            </section>
        </main>

        <!-- Pop-up with a task's details (filled in by task-details.js) -->
        <dialog id="details-dialog" class="modal modal-small"></dialog>

        <script src="storage.js"></script>
        <script src="task-details.js"></script>
        <script src="home.js"></script>
    </body>
</html>
