<!DOCTYPE html>
<html lang="en" class="auth-pending">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <title>Home | Termline</title>
        <meta name="theme-color" content="#1f1f1f">
        <link rel="manifest" href="manifest.webmanifest">
        <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
        <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-title" content="Termline">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
        <script src="theme.js"></script>
        <script type="module" src="account.js"></script>
        <script type="module" src="data-sync.js"></script>
    </head>
    <body>
        <aside class="sidebar">
            <h1>Termline</h1>
            <nav>
                <a href="index.html" class="active">Home</a>
                <a href="calendar.html">Calendar</a>
                <a href="edit.html">Edit</a>
            </nav>
            <button id="theme-toggle" class="theme-toggle" type="button" title="Theme: Auto" aria-label="Theme: Auto">◐</button>
        </aside>

        <main>
            <section id="today">
                <h2>Today <span id="today-date" class="today-date"></span></h2>
                <h3>Classes</h3>
                <div id="today-classes"></div>
                <h3>Tasks</h3>
                <div id="today-tasks"></div>
            </section>

            <section id="weekly-timeline">
                <div class="list-header">
                    <h2>Weekly Timeline <span id="week-label" class="today-date"></span></h2>
                    <div class="list-controls">
                        <button type="button" id="week-prev" class="btn-small" aria-label="Previous week">‹</button>
                        <button type="button" id="week-today" class="btn-small">Today</button>
                        <button type="button" id="week-next" class="btn-small" aria-label="Next week">›</button>
                    </div>
                </div>
                <div id="week-grid" class="week-grid"></div>
            </section>

            <section id="todo">
                <h2>To-Do (Next 10 Days)</h2>
                <div id="todo-list"></div>
            </section>
        </main>

        <!-- Pop-up with a task's details (filled in by task-details.js) -->
        <dialog id="details-dialog" class="modal modal-small"></dialog>

        <script src="storage.js"></script>
        <script src="task-details.js"></script>
        <script src="home.js"></script>
    </body>
</html>
